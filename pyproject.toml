[project]
name = "property-scraper"
version = "0.1.0"
description = "Zillow property listing collector with CSV output and a local read-only JSON API"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "seleniumbase>=4.51,<5",
]

[project.scripts]
property-scraper = "property_scraper:main"
property-api = "listing_api:main"
property-ontario = "ontario_pull:main"

[tool.setuptools]
py-modules = [
  "property_scraper",
  "listing_api",
  "field_utils",
  "ontario_pull",
]

[tool.ruff]
line-length = 100
target-version = "py311"
