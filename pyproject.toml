[project]
name = "property-scraper"
version = "0.1.0"
description = "An API-first property research pipeline with optional browser collectors"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "selenium>=4.20,<5",
  "seleniumbase>=4.40,<5",
]

[project.scripts]
property-scraper = "property_scraper:main"
property-scraper-sb = "seleniumbase_scraper:main"
property-api = "listing_api:main"
property-reso = "reso_ingest:main"

[tool.setuptools]
py-modules = [
  "property_scraper",
  "seleniumbase_scraper",
  "listing_api",
  "field_utils",
  "reso_ingest",
]

[tool.ruff]
line-length = 100
target-version = "py311"
