<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Attach-mode fixture — Zillow-shaped result cards</title>
</head>
<body>
  <main>
    <section id="grid-search-results" class="list">
      <ul class="photo-cards photo-cards_wow">
        <li class="photo-cards__item">
          <article data-testid="property-card">
            <a data-testid="property-card-link"
               href="/homedetails/123-Maple-St-Toronto-ON/12345678_zpid/">123 Maple St, Toronto, ON</a>
            <div data-testid="property-card-price">$599,900</div>
            <div data-testid="property-card-details">3 bds | 2 ba | 1,500 sqft</div>
            <div data-testid="property-card-brokerage">MLS® ID #C12345678, Royal LePage Realty</div>
          </article>
        </li>
        <li class="photo-cards__item">
          <article data-testid="property-card">
            <a data-testid="property-card-link"
               href="/homedetails/456-Oak-Ave-Toronto-ON/87654321_zpid/">456 Oak Ave, Toronto, ON</a>
            <div data-testid="property-card-price">$1,250,000</div>
            <div data-testid="property-card-details">4 bds | 3.5 ba | 2,200 sqft</div>
            <div data-testid="property-card-brokerage">Sutton Group Realty Ltd.</div>
          </article>
        </li>
      </ul>
    </section>
    <a class="next" aria-disabled="true" href="#">Next page</a>
  </main>
</body>
</html>
